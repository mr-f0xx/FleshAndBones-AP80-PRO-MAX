# Hidizs AP80 Pro Max port (360x640 portrait): colours, font, iconsets.

wps: /.rockbox/wps/FleshAndBones.wps
sbs: /.rockbox/wps/FleshAndBones.sbs
backdrop: -
selector type: bar (solid color)
# The selection bar is the background colour: the selected row is shown by its
# vacuum-tube orange text (and icon) only, in every list (main menu, file
# browser, settings); the other rows stay grey.
line selector start color: 000000
line selector end color: 000000
line selector text color: FF4D00
filetype colours: -
# Accent colour: vacuum-tube orange. Every icon the skins draw in the theme
# colour (battery, playback buttons, peak meter, volume bar, play/hold/disk icons)
# follows it; the header and footer rules and the file type tag use the same FF4D00.
foreground color: FF4D00
background color: 000000
# Main font: LanaPixel x3 (also covers Japanese, Chinese and Korean).
font: /.rockbox/fonts/21-LanaPixel.fnt
iconset: modone.bmp
viewers iconset: modone_viewer.bmp
statusbar: off
scrollbar: off
show icons: on

# --- Portrait / touch screen extras ---
# Row pitch for every list (main menu, file browser, database, settings).
# Rockbox computes  line height = font height + list padding,  so 42 + 37 = 79 px --
# close to the stock spacing on this 249 dpi panel (its own "auto" value is
# dpi*4/12 = 83 px; 79 px is still 8 mm per row).  The list viewport in
# FleshAndBones.sbs is sized for exactly six of those rows, with black space left
# above and below them so rows scrolled by touch are cut off before the orange
# header / footer rules, and room for a roomy now playing footer.
list padding: 37
# Volume and battery are drawn by the skin, not by the status bar.
volume display: graphic
battery display: graphic
# The theme's album art box is 300x300; the album art converter script in
# extras/ writes cover.jpg next to the FLACs.
album art: prefer image file
