# Hidizs AP80 Pro Max port (360x640 portrait): colours, font, iconsets.

wps: /.rockbox/wps/FleshAndBones.wps
sbs: /.rockbox/wps/FleshAndBones.sbs
backdrop: -
selector type: bar (solid color)
line selector start color: 000000
line selector end color: 000000
line selector text color: ffffff
filetype colours: -
foreground color: efcc02
background color: 000000
font: /.rockbox/fonts/26-ProFontIIx.fnt
iconset: modone.bmp
viewers iconset: modone_viewer.bmp
statusbar: off
scrollbar: off
show icons: on

# --- Portrait / touch screen extras ---
# Row pitch for every list (main menu, file browser, database, settings).
# Rockbox computes  line height = font height + list padding,  so 26 + 57 = 83 px --
# the same spacing the stock theme uses on this 249 dpi panel (its own "auto" value
# is dpi*4/12 = 83 px).  The list viewport in FleshAndBones.sbs is sized for exactly
# seven of those rows, so the menu fills the screen from the header to the bottom.
list padding: 57
# Volume and battery are drawn by the skin, not by the status bar.
volume display: graphic
battery display: graphic
# The theme's album art box is 300x300; the album art converter script in
# extras/ writes cover.jpg next to the FLACs.
album art: prefer image file
